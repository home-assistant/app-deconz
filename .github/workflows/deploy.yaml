---
# yamllint disable rule:comments rule:line-length rule:truthy
name: Deploy

on:
  push:
    branches:
      - main
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  ci:
    permissions:
      contents: read
      security-events: write
    uses: home-assistant/workflows/.github/workflows/app-ci.yaml@f8d490cb29e4cd0baa2f7fde1f9d0c59774cc0db # v0.2.0

  deploy:
    needs: ci
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: home-assistant/workflows/.github/workflows/app-deploy.yaml@f8d490cb29e4cd0baa2f7fde1f9d0c59774cc0db # v0.2.0
    with:
      repository: apps
      repository_edge: "apps-dev"
    secrets:
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
